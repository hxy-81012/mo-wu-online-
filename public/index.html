<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨武 · 江湖对弈 联机版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1c1a17;--ink2:#4a453d;--ink3:#7a7367;--paper:#e9e0cd;--paper2:#f7f2e7;--red:#9c2b25;--gold:#8a6d3b;--blue:#3a4a5c;--green:#4a5a45}
html,body{height:100%}
body{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;background:var(--paper);color:var(--ink);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/></filter><rect width='260' height='260' filter='url(%23n)' opacity='0.4'/></svg>");
  opacity:.22;mix-blend-mode:multiply}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 55% 40% at 12% 18%,rgba(28,26,23,.10),transparent 70%),
  radial-gradient(ellipse 50% 38% at 88% 78%,rgba(28,26,23,.09),transparent 70%)}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.title{text-align:center;margin-bottom:14px}
.title h1{font-size:34px;letter-spacing:.35em;font-weight:600}
.title .sub{font-size:12px;letter-spacing:.5em;color:var(--ink3);margin-top:4px}
.title .brush{width:180px;height:14px;margin:6px auto 0;background:radial-gradient(ellipse at center,rgba(28,26,23,.55),transparent 72%);filter:blur(1px)}

.lobby{max-width:440px;margin:40px auto;background:linear-gradient(180deg,rgba(247,242,231,.95),rgba(233,224,205,.9));border:1px solid rgba(28,26,23,.22);padding:30px 26px;border-radius:2px;text-align:center}
.lobby h2{font-size:20px;letter-spacing:.3em;margin-bottom:20px;font-weight:500}
.lobby .row{margin-bottom:14px}
.lobby input{font-family:inherit;font-size:16px;padding:10px 14px;border:1px solid rgba(28,26,23,.3);background:rgba(255,255,255,.5);width:100%;letter-spacing:.2em;text-align:center;border-radius:1px}
.lobby input:focus{outline:none;border-color:var(--red)}

.roombar{text-align:center;font-size:13px;color:var(--ink2);letter-spacing:.15em;margin-bottom:10px;padding:8px;background:rgba(255,255,255,.35);border:1px solid rgba(28,26,23,.15)}
.roombar b{color:var(--red);font-size:16px;letter-spacing:.25em}

.board{display:grid;grid-template-columns:1fr;gap:10px}
.side{background:linear-gradient(180deg,rgba(247,242,231,.9),rgba(233,224,205,.75));border:1px solid rgba(28,26,23,.18);border-radius:2px;padding:12px 14px;position:relative;box-shadow:0 2px 10px rgba(28,26,23,.06),inset 0 0 40px rgba(255,255,255,.35)}
.side::before{content:'';position:absolute;inset:3px;border:1px solid rgba(28,26,23,.07);pointer-events:none}
.side.active{border-color:rgba(156,43,37,.55);box-shadow:0 0 0 1px rgba(156,43,37,.25),0 3px 16px rgba(156,43,37,.12)}
.side.dead{filter:grayscale(.7);opacity:.65}
.phead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.pname{font-size:19px;letter-spacing:.18em;font-weight:600}
.pweapon{font-size:12px;color:var(--ink3);letter-spacing:.1em}
.tag{font-size:11px;padding:2px 8px;border:1px solid rgba(28,26,23,.25);border-radius:1px;letter-spacing:.12em;color:var(--ink2);background:rgba(255,255,255,.3)}
.tag.red{border-color:rgba(156,43,37,.5);color:var(--red)}
.hpwrap{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hpbar{flex:1;height:16px;background:rgba(28,26,23,.09);border:1px solid rgba(28,26,23,.25);position:relative;overflow:hidden;border-radius:1px}
.hpfill{height:100%;width:100%;transition:width .45s cubic-bezier(.2,.8,.3,1);background:linear-gradient(90deg,#5c1f1a,#9c2b25 60%,#b8463c)}
.hpnum{font-size:15px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:10px}
.stats b{color:var(--ink);font-weight:600}
.stat{display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:76px;height:104px;border-radius:2px;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid rgba(28,26,23,.3);background:linear-gradient(160deg,rgba(247,242,231,.95),rgba(226,216,196,.9));font-size:15px;letter-spacing:.08em;text-align:center;line-height:1.25;padding:6px;transition:all .3s}
.slot.back{background:linear-gradient(150deg,#2a2722,#3d3830 55%,#242220);border-color:rgba(0,0,0,.5)}
.slot.back::after{content:'武';color:rgba(233,224,205,.32);font-size:24px}
.slot.back span{display:none}
.slot.empty{opacity:.25;border-style:dashed}
.slot.atk{border-color:rgba(156,43,37,.55);background:linear-gradient(160deg,#faf3ef,#f0e2dc)}
.slot.def{border-color:rgba(58,74,92,.5);background:linear-gradient(160deg,#f2f4f6,#e3e8ec)}
.slot.mov{border-color:rgba(74,90,69,.5);background:linear-gradient(160deg,#f2f5f0,#e4eae0)}
.slot.utl{border-color:rgba(138,109,59,.5);background:linear-gradient(160deg,#f8f3e8,#eee5d2)}
.slot .cdmark{position:absolute;bottom:3px;right:4px;font-size:10px;color:var(--ink3)}
  .center{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 14px}
.distbox{text-align:center;padding:6px 18px;border:1px solid rgba(28,26,23,.22);background:rgba(255,255,255,.35);border-radius:2px;min-width:120px}
.distbox .lbl{font-size:11px;color:var(--ink3);letter-spacing:.2em}
.distbox .val{font-size:26px;font-weight:600}
.center .sideinfo{font-size:12px;color:var(--ink2);letter-spacing:.06em;line-height:1.7}

.log{height:120px;overflow-y:auto;padding:10px 12px;font-size:13px;line-height:1.85;background:linear-gradient(180deg,rgba(247,242,231,.6),rgba(233,224,205,.4));border:1px solid rgba(28,26,23,.15);border-radius:2px;color:var(--ink2);margin-top:10px}
.log div{padding:1px 0}
.log .k{color:var(--red);font-weight:600}
.log .b{color:var(--blue)}
.log .g{color:var(--green)}
.log .y{color:var(--gold)}
.log::-webkit-scrollbar{width:5px}
.log::-webkit-scrollbar-thumb{background:rgba(28,26,23,.25)}

.btn{font-family:inherit;font-size:14px;letter-spacing:.18em;padding:9px 26px;cursor:pointer;color:var(--paper2);background:linear-gradient(180deg,#3d3830,#26231e);border:1px solid rgba(0,0,0,.5);border-radius:1px;transition:all .2s}
.btn:hover{background:linear-gradient(180deg,#4d463b,#332f28);letter-spacing:.24em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(28,26,23,.35)}
.btn.ghost:hover{background:rgba(28,26,23,.07)}
.btn:disabled{opacity:.35;cursor:not-allowed}

.pickwrap{background:linear-gradient(180deg,rgba(247,242,231,.95),rgba(233,224,205,.9));border:1px solid rgba(28,26,23,.22);padding:14px;border-radius:2px;margin-top:12px}
.pickhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.pickhead .t{font-size:16px;letter-spacing:.2em}
.pickhead .n{font-size:13px;color:var(--red);letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.pcard{border:1px solid rgba(28,26,23,.28);border-radius:2px;padding:9px 8px;background:linear-gradient(160deg,rgba(255,255,255,.75),rgba(240,234,220,.7));cursor:pointer;transition:all .15s;position:relative;min-height:112px;display:flex;flex-direction:column;gap:4px}
.pcard:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(28,26,23,.14)}
.pcard.sel{border-color:var(--red);background:linear-gradient(160deg,#fbf1ee,#f2ded8);box-shadow:0 0 0 1px rgba(156,43,37,.4)}
.pcard .cn{font-size:15px;letter-spacing:.1em;font-weight:600}
.pcard .ct{font-size:10px;color:var(--ink3);letter-spacing:.14em}
.pcard .cd{font-size:11px;color:var(--ink2);line-height:1.55;flex:1}
.pcard .badge{position:absolute;top:6px;right:6px;font-size:10px;padding:1px 6px;border:1px solid rgba(28,26,23,.3);color:var(--ink3);border-radius:1px}
.pcard .badge.once{border-color:rgba(156,43,37,.5);color:var(--red)}

.partbox{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.partbtn{width:96px;height:96px;border:1px solid rgba(28,26,23,.3);border-radius:2px;background:linear-gradient(160deg,rgba(247,242,231,.95),rgba(226,216,196,.9));cursor:pointer;font-family:inherit;font-size:17px;letter-spacing:.15em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .18s;color:var(--ink)}
.partbtn:hover{border-color:var(--red);box-shadow:0 0 0 1px rgba(156,43,37,.35);transform:translateY(-2px)}
.partbtn small{font-size:10px;color:var(--ink3);letter-spacing:.1em}

.actions{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.hint{text-align:center;font-size:12px;color:var(--ink3);letter-spacing:.15em;margin-top:10px;line-height:1.9}
.waitingbox{text-align:center;padding:20px;font-size:14px;color:var(--ink3);letter-spacing:.2em}
.result{text-align:center;padding:30px;font-size:22px;letter-spacing:.3em;color:var(--red);font-weight:600}

.foot{text-align:center;margin-top:18px;font-size:11px;color:var(--ink3);letter-spacing:.2em}

@media(max-width:760px){
  .title h1{font-size:26px;letter-spacing:.22em}
  .slot{width:60px;height:88px;font-size:13px}
  .center{grid-template-columns:1fr;gap:6px;text-align:center}
  .grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
</style>
</head>
<body>
<div id="app">
  <div class="title">
    <h1>墨武</h1>
    <div class="sub">江湖对弈 · 联机版</div>
    <div class="brush"></div>
  </div>

  <div class="lobby" id="lobby">
    <h2>入 江 湖</h2>
    <div class="row"><button class="btn" id="createBtn" style="width:100%">创 建 房 间</button></div>
    <div class="row" style="color:var(--ink3);font-size:12px;letter-spacing:.2em">或</div>
    <div class="row"><input id="roomInput" maxlength="4" placeholder="输入房间号" /></div>
    <div class="row"><button class="btn ghost" id="joinBtn" style="width:100%">加 入 房 间</button></div>
  </div>

  <div id="game" style="display:none">
    <div class="roombar">房 间 号 <b id="roomIdDisplay">----</b> · 你是 <span id="myNameDisplay">—</span></div>    <div class="board">
      <div class="side" id="side1">
        <div class="phead">
          <span class="pname" id="name1">侠客 · 乙</span>
          <span class="pweapon" id="wp1">—</span>
          <span class="tag" id="tag1">守</span>
        </div>
        <div class="hpwrap"><div class="hpbar"><div class="hpfill" id="hp1"></div></div><div class="hpnum" id="hpn1">15 / 15</div></div>
        <div class="stats" id="st1"></div>
        <div class="slots" id="sl1"></div>
      </div>
      <div class="center">
        <div class="sideinfo" id="infoA"></div>
        <div class="distbox"><div class="lbl">距 离</div><div class="val" id="distVal">1</div></div>
        <div class="sideinfo" id="infoB" style="text-align:right"></div>
      </div>
      <div class="side" id="side0">
        <div class="phead">
          <span class="pname" id="name0">侠客 · 甲</span>
          <span class="pweapon" id="wp0">—</span>
          <span class="tag red" id="tag0">攻</span>
        </div>
        <div class="hpwrap"><div class="hpbar"><div class="hpfill" id="hp0"></div></div><div class="hpnum" id="hpn0">15 / 15</div></div>
        <div class="stats" id="st0"></div>
        <div class="slots" id="sl0"></div>
      </div>
    </div>

    <div class="log" id="log"></div>
    <div id="panel"></div>
    <div class="actions" id="actions"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="foot">墨 武 · 江 湖 对 弈</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const WEAPONS = {blade:{name:'刀 · 盾'}, spear:{name:'长枪'}};
const $ = s => document.querySelector(s);
const socket = io();

let myIdx = -1;
let roomId = null;
let lastState = null;
let pickSelected = [];

socket.on('connect', () => {});
socket.on('joined', ({roomId: rid, playerIdx}) => {
  myIdx = playerIdx;
  roomId = rid;
  $('#roomIdDisplay').textContent = rid;
  $('#myNameDisplay').textContent = playerIdx === 0 ? '侠客 · 甲' : '侠客 · 乙';
  $('#lobby').style.display = 'none';
  $('#game').style.display = 'block';
});
socket.on('state', s => { lastState = s; render(s); });
socket.on('error_msg', msg => { alert(msg); });
socket.on('opponent_left', () => {
  alert('对手已离开房间。');
  location.reload();
});

$('#createBtn').onclick = () => {
  if (!socket.connected) { alert('尚未连接服务器，请稍候'); return; }
  socket.emit('createRoom');
};
$('#joinBtn').onclick = () => {
  const rid = $('#roomInput').value.trim().toUpperCase();
  if (!rid) { alert('请输入房间号'); return; }
  socket.emit('joinRoom', {roomId: rid});
};

function sendInput(type, data){
  socket.emit('input', {type, data});
}function fmt(n){
  if (Math.abs(n - Math.round(n)) < 1e-9) return String(Math.round(n));
  return n.toFixed(1);
}

function render(s){
  if (!s) return;
  if (s.phase === 'waiting'){
    $('#panel').innerHTML = `<div class="waitingbox">等待对手加入…<br>房间号：<b style="color:var(--red);font-size:18px">${s.roomId}</b></div>`;
    $('#actions').innerHTML = '';
    $('#hint').innerHTML = '';
    return;
  }
  renderSide(s.me, 0);
  renderSide(s.opp, 1);
  renderLog(s.log);
  $('#distVal').textContent = s.distance;
  const attacker = (s.attackerIdx === s.myIdx) ? s.me : s.opp;
  const defender = (s.attackerIdx === s.myIdx) ? s.opp : s.me;
  $('#infoA').innerHTML = `大回合 <b>${s.roundNo||1}</b><br>攻方：${attacker?attacker.name:'—'}`;
  $('#infoB').innerHTML = `距离 ${s.distance}<br>守方：${defender?defender.name:'—'}`;
  renderInput(s);
}

function renderSide(p, pos){
  if (!p){
    $('#name'+pos).textContent = '—';
    $('#wp'+pos).textContent = '—';
    $('#hp'+pos).style.width = '0%';
    $('#hpn'+pos).textContent = '— / 15';
    $('#st'+pos).innerHTML = '';
    $('#sl'+pos).innerHTML = '';
    return;
  }
  $('#name'+pos).textContent = p.name;
  $('#wp'+pos).textContent = (WEAPONS[p.weapon]||{}).name || '—';
  const ratio = Math.max(0, p.hp/15);
  $('#hp'+pos).style.width = (ratio*100)+'%';
  $('#hpn'+pos).textContent = fmt(Math.max(0,p.hp))+' / 15';

  const stats = [];
  stats.push(`<span class="stat"><span class="dot"></span>速度 <b>${fmt((p.permSpeed||0)+(p.tempSpeed||0))}</b>${p.permSpeed?' <span style="color:#7a7367;font-size:10px">(永久'+p.permSpeed+')</span>':''}</span>`);
  if (p.weapon === 'blade'){
    stats.push(`<span class="stat">刀势 <b>${(p.bladeHits||0)%3}/3</b> · 触发 <b>${p.bladeTriggers||0}</b></span>`);
    if (p.rusted) stats.push(`<span class="stat">锈蚀 <b>+${p.rustBonus||0}</b></span>`);
    stats.push(`<span class="stat">格挡成功 <b>${p.blockSuccess||0}</b></span>`);
  } else if (p.weapon === 'spear'){
    stats.push(`<span class="stat">枪势 <b>${(p.spearAtkCount||0)%2}/2</b></span>`);
    if (p.lastStandActive) stats.push(`<span class="stat" style="color:#9c2b25">最后一击 · 待发</span>`);
  }
  if (p.nextAtkBonus) stats.push(`<span class="stat" style="color:#9c2b25">下次攻击 +${fmt(p.nextAtkBonus)}</span>`);
  if (p.nextSure) stats.push(`<span class="stat" style="color:#9c2b25">下次必中</span>`);
  if (p.noBlock) stats.push(`<span class="stat" style="color:#3a4a5c">禁用格挡</span>`);
  if (p.noJumpCrouch) stats.push(`<span class="stat" style="color:#3a4a5c">禁跳/蹲</span>`);
  $('#st'+pos).innerHTML = stats.join('');

  const hand = p.hand || [];
  let html = '';
  for (let i = 0; i < 5; i++){
    const c = hand[i];
    if (!c){ html += `<div class="slot empty"><span>—</span></div>`; continue; }
    if (c.back){ html += `<div class="slot back"><span></span></div>`; continue; }
    const t = c.type==='atk'?'atk':c.type==='def'?'def':c.type==='mov'?'mov':'utl';
    html += `<div class="slot ${t}"><span>${c.name}</span>${c.cd?`<span class="cdmark">冷${c.cd}</span>`:''}</div>`;
  }
  $('#sl'+pos).innerHTML = html;

  const isAttacker = (lastState && lastState.attackerIdx === p.idx);
  $('#tag'+pos).textContent = isAttacker ? '攻' : '守';
  $('#tag'+pos).className = 'tag' + (isAttacker ? ' red' : '');
  $('#side'+pos).classList.toggle('active', isAttacker);
  $('#side'+pos).classList.toggle('dead', p.hp <= 0);
}

function renderLog(logs){
  if (!logs) return;
  const el = $('#log');
  el.innerHTML = logs.map(l => `<div class="${l.cls||''}">${l.html}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}function renderInput(s){
  if (s.phase === 'over'){
    const text = s.gameOver ? s.gameOver.text : '对局结束。';
    $('#panel').innerHTML = `<div class="result">${text}</div>`;
    $('#actions').innerHTML = `<button class="btn" onclick="location.reload()">重 新 开 始</button>`;
    $('#hint').innerHTML = '';
    return;
  }

  const myWf = (s.waitingFor||[]).find(w => w.idx === s.myIdx);

  if (!myWf){
    $('#panel').innerHTML = `<div class="waitingbox">等待对手行动…</div>`;
    $('#actions').innerHTML = '';
    $('#hint').innerHTML = '';
    return;
  }

  switch (myWf.type){
    case 'weapon': {
      $('#panel').innerHTML = `<div class="pickwrap">
        <div class="pickhead"><div class="t">择 兵 而 战</div></div>
        <div class="partbox">
          <button class="partbtn" id="wBlade">刀 · 盾<small>基础 1，可格挡</small></button>
          <button class="partbtn" id="wSpear">长 枪<small>基础 1.5，格挡化会心</small></button>
        </div>
      </div>`;
      $('#actions').innerHTML = '';
      $('#hint').innerHTML = '选择你的武器，确定后不可更改。';
      $('#wBlade').onclick = () => sendInput('weapon', 'blade');
      $('#wSpear').onclick = () => sendInput('weapon', 'spear');
      break;
    }
    case 'pick': {
      renderPickUI(myWf.available || []);
      break;
    }
    case 'part': {
      $('#panel').innerHTML = `<div class="pickwrap">
        <div class="pickhead"><div class="t">择 击 之 处</div></div>
        <div class="partbox">
          <button class="partbtn" data-p="up">上<small>攻其首</small></button>
          <button class="partbtn" data-p="mid">中<small>攻其躯</small></button>
          <button class="partbtn" data-p="down">下<small>攻其足</small></button>
        </div>
      </div>`;
      $('#actions').innerHTML = '';
      $('#hint').innerHTML = '选择攻击部位。';
      document.querySelectorAll('.partbtn').forEach(b => {
        b.onclick = () => sendInput('part', b.dataset.p);
      });
      break;
    }
    case 'next': {
      $('#panel').innerHTML = '';
      $('#actions').innerHTML = `<button class="btn" id="nextBtn">继 续</button>`;
      $('#hint').innerHTML = '等待双方确认。';
      $('#nextBtn').onclick = () => { $('#actions').innerHTML = ''; sendInput('next', null); };
      break;
    }
  }
}

function renderPickUI(available){
  pickSelected = [];
  function draw(){
    const cardsHtml = available.map(c => {
      const sel = pickSelected.includes(c.uid);
      return `<div class="pcard ${sel?'sel':''}" data-uid="${c.uid}">
        <div class="badge ${c.once?'once':''}">${c.once?'一':(c.cd?'冷'+c.cd:'—')}</div>
        <div class="cn">${c.name}</div>
        <div class="ct">${typeLabel(c.type)}</div>
        <div class="cd">${c.desc||''}</div>
      </div>`;
    }).join('');
    $('#panel').innerHTML = `<div class="pickwrap">
      <div class="pickhead">
        <div class="t">择 五 招 出 战</div>
        <div class="n">已选 ${pickSelected.length} / 5</div>
      </div>
      <div class="grid">${cardsHtml}</div>
    </div>`;
    $('#actions').innerHTML = `<button class="btn" id="confirmPick" ${pickSelected.length!==5?'disabled':''}>确 认 出 招</button>`;
    $('#hint').innerHTML = '从可用招式中选择五张，依序出战。';
    document.querySelectorAll('.pcard').forEach(el => {
      el.onclick = () => {
        const uid = el.dataset.uid;
        const i = pickSelected.indexOf(uid);
        if (i >= 0) pickSelected.splice(i,1);
        else if (pickSelected.length < 5) pickSelected.push(uid);
        draw();
      };
    });
    const btn = $('#confirmPick');
    if (btn) btn.onclick = () => {
      if (pickSelected.length !== 5) return;
      $('#panel').innerHTML = `<div class="waitingbox">已出招，等待对手…</div>`;
      $('#actions').innerHTML = '';
      sendInput('pick', pickSelected.slice());
    };
  }
  draw();
}

function typeLabel(t){
  return t==='atk'?'攻击':t==='def'?'防御':t==='mov'?'移动':'身法';
}
</script>
</body>
</html>
